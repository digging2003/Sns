<html lang="ko" 
    xmlns:th="http://www.thymeleaf.org" 
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layouts/default}">
        
	<main layout:fragment="contents" class="d-flex justify-content-center">
	  <div class="post">
	      
	    <div class="post-image mt-2">
	      <img src="images/Image.png" alt="Post Image" class="w-100">
	    </div>
	    <textarea class="textarea mt-3" rows="4" placeholder="문구 추가..."></textarea>
	    <button type="button" class="btn btn-primary w-100 mt-3">공유하기</button>
	      
	  </div>
	</main>


	<script layout:fragment="script">
	    // 사용자 이미지 클릭 시 팝업 띄우기
	    $("#userImage").on("click", function() {
	        $("#popup").toggle();  // 팝업 창 토글 (보이기/숨기기)
	    });
	
	    // 로그아웃 버튼 클릭 시 처리
	    $("#logoutButton").on("click", function() {
	        // 로그아웃 처리 (이 부분은 실제로 로그아웃을 처리하는 로직으로 변경해야 합니다.)
	        alert("로그아웃되었습니다. 로그인 페이지로 이동합니다.");
	        
	    });
	
	    // 팝업 외부를 클릭하면 팝업 숨기기
	    $(document).on("click", function(event) {
	        if (!$(event.target).closest("#popup, #userImage").length) {
	            $("#popup").hide(); // 팝업 숨기기
	        }
	    });
	</script>
</html>
